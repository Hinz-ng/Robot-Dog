; ============================================================================
; CAN BRING-UP -- two identical ESP32-S3 nodes, ONE sketch, TWO environments.
; ============================================================================
; The nodes differ ONLY in build flags. Never keep two edited copies of
; main.cpp: that is how node B gets flashed with node A's ID and an hour
; disappears into a phantom bus fault.
;
;   pio run -e nodeA -t upload
;   pio run -e nodeB -t upload
;   pio device monitor -e nodeA      (terminal 1)
;   pio device monitor -e nodeB      (terminal 2)
;
; Then press 'b' in each window and CONFIRM the banner before touching the
; analyzer:  nodeA -> mode NORMAL, ID = 0x100
;            nodeB -> mode NORMAL, ID = 0x101
; ============================================================================

[env]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 921600
monitor_rts   = 0
monitor_dtr   = 0
upload_speed  = 921600
build_flags   = -DARDUINO_USB_CDC_ON_BOOT=1

; NOTE ON ${env.build_flags} BELOW -- it is load-bearing.
; A child env that writes `build_flags = -D STAGE=1` REPLACES the parent's
; flags instead of adding to them, silently dropping ARDUINO_USB_CDC_ON_BOOT=1
; and with it all serial output.

; --- PORTS -----------------------------------------------------------------
; Two identical boards enumerate with the same USB VID:PID, so autodetect
; cannot tell them apart -- the ports MUST be pinned here by hand.
; PlatformIO matches upload_port/monitor_port against the port NAME only
; (fnmatch on "COM10"); it does NOT match USB serial numbers, so a
; serial-number pattern will not work.
; To find them: plug in ONE board, run `pio device list`, note the port;
; unplug it, plug in the other, repeat.

[env:nodeA]
build_flags   = ${env.build_flags} -D STAGE=1 -D NODE_TX_ID=0x100
upload_port   = COM10
monitor_port  = COM10

[env:nodeB]
build_flags   = ${env.build_flags} -D STAGE=1 -D NODE_TX_ID=0x101
upload_port   = COM7
monitor_port  = COM7

; Stage 0 / single-node regression build. No partner, no ACK expected.
; Kept so the S0 configuration stays reproducible.
[env:solo]
build_flags   = ${env.build_flags} -D STAGE=0 -D NODE_TX_ID=0x100
