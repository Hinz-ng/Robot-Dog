; ============================================================================
; One ENVIRONMENT per physical assembly. You never hand-edit a constant before
; a flash -- you pick an environment:
;
;     pio run -e J01 -t upload
;     pio run -e A1  -t upload        (the original ABZ assembly)
;
; JOINT_ID indexes joint_cal.h. joint_cal.h #errors if it is undefined and
; static_asserts the range against the table's own length, so neither a
; joint-agnostic nor an out-of-range binary can be built by accident.
;
; NOTE ON [env:A1]: it builds THIS sketch, which drives an MT6816 over bit-banged
; SPI on PB5-PB8. A1 is the ABZ/TIM4 assembly. The binary will flash and boot but
; its sensor cannot work -- see the warning on that environment below.
; ============================================================================

[common]
platform = ststm32@17.6.0
board = disco_b_g431b_esc1
framework = arduino
monitor_speed = 921600
lib_archive = false
; SimpleFOCDrivers REMOVED 2026-09-10. It was pinned at 1.0.5, and upstream has
; WITHDRAWN 1.0.5 from the PlatformIO registry -- only 1.0.7/1.0.8/1.0.9 remain.
; The pin was therefore unsatisfiable on any CLEAN build, on any machine, for all
; twelve joints; it only kept working because a cached copy sat in .pio. Deleting
; .pio (FIRMWARE.md section 4's own clean procedure) surfaced it.
; Dropped rather than re-pinned because NOTHING INCLUDES IT: no file in src/ pulls
; a SimpleFOCDrivers header, and FIRMWARE.md section 4 already recorded "nothing
; currently needs it". With LDF in chain mode an un-included library contributes no
; objects, so removing it should be binary-neutral -- if a future build ever needs
; it back, take the upstream git tag (github.com/simplefoc/Arduino-FOC-drivers.git
; #v1.0.5), which still exists, NOT a registry version bump.
lib_deps =
    askuric/Simple FOC @ 2.3.1
    SPI
    Wire
; -I contract: the Tier-0 <-> Tier-1 contract headers (mit_types.h, can_proto.h).
; contract/ is the ONLY directory both tiers compile; the ESP32 master gets
; -I ../contract and nothing from src/, so the compiler enforces that the two
; tiers share the contract and nothing else.
build_flags =
    -DHAL_OPAMP_MODULE_ENABLED
    -I contract

[env:J01]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=1

[env:J02]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=2

[env:J03]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=3

[env:J04]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=4

[env:J05]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=5

[env:J06]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=6

[env:J07]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=7

[env:J08]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=8

[env:J09]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=9

[env:J10]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=10

[env:J11]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=11

[env:J12]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=12

; the ORIGINAL ABZ assembly. *** THIS HARDWARE NO LONGER EXISTS *** -- it was
; rebuilt as J02 (rubbing magnet remounted, MT6816 SPI board fitted), so this
; environment now selects constants for an assembly that cannot be flashed and
; is superseded by [env:J02]. The row is kept at JOINT_ID=13 so nothing shifts.
;
; *** THIS ENVIRONMENT IS NOT FLASHABLE ONTO A1 IN THIS REPOSITORY. ***
; It selects A1's CONSTANTS, but the encoder driver compiled in is MT6816 4-wire
; SPI (PB5=CSN, PB6=MOSI, PB7=MISO, PB8=SCK). A1 is wired for ABZ quadrature on
; TIM4. Flashing this on A1 gives a board that boots, prints a plausible banner,
; and reads garbage angles -- 'e' / phase 1 will fail immediately, which is the
; only reason this is loud rather than silent.
; The row exists so the SEPARATE ABZ sketch can pick up A1's constants by
; JOINT_ID. Do not build this target expecting to run the ABZ assembly.
[env:A1]
extends = common
; ENCODER_ABZ makes open_test.cpp (the MT6816 SPI source) fail at BUILD time.
; Deliberate: this target must not silently produce a flashable binary.
build_flags = ${common.build_flags} -D JOINT_ID=13 -D ENCODER_ABZ