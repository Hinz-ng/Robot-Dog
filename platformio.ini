; ============================================================================
; One ENVIRONMENT per physical assembly: you pick an environment, never edit a
; constant before a flash.
;
;     pio run -e J01 -t upload        bench harness, joint 1
;     pio run -e T0_J01 -t upload     Tier 0, joint 1
;
; JOINT_ID indexes joint_cal.h, which #errors if it is undefined and
; static_asserts the range, so neither a joint-agnostic nor an out-of-range
; binary can be built. [env:A1] fails to build on purpose (see below).
; ============================================================================

[common]
platform = ststm32@17.6.0
board = disco_b_g431b_esc1
framework = arduino
monitor_speed = 921600
lib_archive = false
; SimpleFOCDrivers is not used (nothing includes it; 1.0.5 is gone from the
; registry). If ever needed: upstream git tag v1.0.5, not a registry bump.
lib_deps =
    askuric/Simple FOC @ 2.3.1
    SPI
    Wire
; -I contract: the Tier-0 <-> Tier-1 contract headers (mit_types.h, can_proto.h).
; contract/ is the ONLY directory both tiers compile; the ESP32 master gets
; -I ../contract and nothing from src/, so the compiler enforces that the two
; tiers share the contract and nothing else.
build_flags =
    -DHAL_OPAMP_MODULE_ENABLED
    -I contract
; EXPLICIT WHITELIST: exactly one file defines setup()/loop() per env.
; The bench harness is open_test.cpp; Tier 0 (src/tier0/) has its own section
; below. A stray .cpp in src/ is now invisible to every build instead of being
; silently linked into it (FIRMWARE.md 4, "a stray main.cpp").
build_src_filter = -<*> +<open_test.cpp>

; ============================================================================
; TIER 0 -- the shipped joint firmware (CAN-T0). Same shared headers, none of
; the bench harness (open_test.cpp, autocalib.h). Flash T0_Jxx for CAN / leg
; work and Jxx for calibration; the boot banner and CAN STATUS say which.
; No -D HAL_FDCAN_MODULE_ENABLED: this board's variant header already defines
; it (passing it again gives ~40 redefinition warnings).
; git_hash.py is HERE ONLY, never in [common]: it changes every commit and would
; break the harness's byte-identical md5 gate.
; ============================================================================
[tier0]
extends = common
build_src_filter = -<*> +<tier0/>
build_flags = ${common.build_flags}
extra_scripts = pre:tools/git_hash.py

[env:T0_J01]
extends = tier0
build_flags = ${tier0.build_flags} -D JOINT_ID=1

[env:T0_J03]
extends = tier0
build_flags = ${tier0.build_flags} -D JOINT_ID=3

; N4d FAULT-TEST BUILDS -- flash one, arm from the phone with zero gains, and
; the joint hangs (1) or HardFaults (2) by itself 3 s later. Pass = it resets
; within ~20 ms and boots with "last reset: IWDG". Needs no console input.
; ALWAYS reflash T0_J01 afterwards: these builds fail on purpose every arm.
[env:T0_J01_HANG]
extends = tier0
build_flags = ${tier0.build_flags} -D JOINT_ID=1 -D T0_FAULT_TEST=1

[env:T0_J01_FAULT]
extends = tier0
build_flags = ${tier0.build_flags} -D JOINT_ID=1 -D T0_FAULT_TEST=2

[env:J01]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=1

[env:J02]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=2

[env:J03]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=3

[env:J04]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=4

[env:J05]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=5

[env:J06]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=6

[env:J07]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=7

[env:J08]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=8

[env:J09]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=9

[env:J10]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=10

[env:J11]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=11

[env:J12]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=12

; A1 -- the original ABZ assembly, rebuilt as J02; the hardware no longer
; exists. Row kept at JOINT_ID=13 so nothing shifts. This source drives an
; MT6816 over SPI, so the env deliberately fails to build (ENCODER_ABZ).
[env:A1]
extends = common
; ENCODER_ABZ makes open_test.cpp (the MT6816 SPI source) fail at BUILD time.
; Deliberate: this target must not silently produce a flashable binary.
build_flags = ${common.build_flags} -D JOINT_ID=13 -D ENCODER_ABZ