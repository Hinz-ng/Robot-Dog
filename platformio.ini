; ============================================================================
; One ENVIRONMENT per physical assembly. You never hand-edit a constant before
; a flash -- you pick an environment:
;
;     pio run -e J01 -t upload
;     pio run -e A1  -t upload        (the original ABZ assembly)
;
; JOINT_ID indexes joint_cal.h. joint_cal.h #errors if it is undefined, so a
; joint-agnostic binary cannot be built by accident.
; ============================================================================

[common]
platform = ststm32@17.6.0
board = disco_b_g431b_esc1
framework = arduino
monitor_speed = 921600
lib_archive = false
lib_deps =
    askuric/Simple FOC @ 2.3.1
    simplefoc/SimpleFOCDrivers @ 1.0.5
    SPI
    Wire
build_flags =
    -DHAL_OPAMP_MODULE_ENABLED

[env:J01]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=1

[env:J02]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=2

[env:J03]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=3

[env:J04]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=4

[env:J05]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=5

[env:J06]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=6

[env:J07]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=7

[env:J08]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=8

[env:J09]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=9

[env:J10]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=10

[env:J11]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=11

[env:J12]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=12

; the ORIGINAL ABZ assembly, kept for fault debugging
[env:A1]
extends = common
build_flags = ${common.build_flags} -D JOINT_ID=13