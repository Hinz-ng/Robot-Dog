; ============================================================================
; ESP32-S3 LEG MASTER -- minimal Tier 1 for CAN-T0. NOT the final Tier 1.
; ============================================================================
; Its own PlatformIO project INSIDE the joint repo, so it compiles the SAME
; contract headers Tier 0 does:
;     pio run -d master -t upload
;     pio device monitor -d master
;
; -I ../contract and NOTHING from ../src: the compiler enforces that the two
; tiers share the contract (mit_types.h, can_proto.h) and nothing else.
;
; Wiring (CAN_BRINGUP 23.9 / CAN-T0 plan 5): GPIO5 -> SN65HVD230 TXD,
; GPIO4 <- RXD, common GND with every ESC1. E-stop: NORMALLY-CLOSED button
; GPIO6 -> GND (open or a broken wire = ESTOP).
; ============================================================================

[env:master]
; PINNED to what is installed (Arduino-ESP32 2.0.17 / IDF 4.4). The CAN
; bring-up project left this unpinned; a platform bump is a toolchain change
; and must be a decision, not a side effect.
platform      = espressif32@6.12.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 921600
monitor_rts   = 0
monitor_dtr   = 0
upload_speed  = 921600
; ARDUINO_USB_CDC_ON_BOOT=1 or the console goes to the UART pins and USB is
; silent. If a second env is ever added, it must extend these flags with
; ${env:master.build_flags}, not replace them (CAN_BRINGUP 23.4b trap).
build_flags   =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I ../contract
extra_scripts = pre:../tools/git_hash.py
